# Keep README.md's "All Public Repositories" table in step with GitHub: daily, on demand
# (Actions tab or `gh workflow run repos.yml`), and whenever the script changes.
name: Update repository list
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/update_repos.py", ".github/workflows/repos.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_repos.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if the table changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the list of public repositories"
          git push
